<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Открытка</title>
  <script src="aframe.min.js"></script>
  <script src="mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item id="cardModel" src="./snowman.glb"></a-asset-item>
    </a-assets>

    <!-- Равномерный свет, чтобы 2D-слои не были темными -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="0 1 2" intensity="0.8"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Подгоните scale и position под размер вашей модели -->
      <a-gltf-model
        src="#cardModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
      ></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
